services:
  frontend:
    build: ..
    expose:
      - "3000"
    volumes:
      - ../node_modules:/app/node_modules
      - ../public:/app/public
      - ../package.json:/app/package.json
      - ~/front/.next:/app/.next
    restart: always
  nginx:
    build: .
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt/live/babywalk.ru:/etc/nginx/ssl:ro
      - ~/dhparam:/etc/nginx/dhparam:ro
    depends_on:
      - frontend
    restart: always
  yandex-kassa:
    build: ../../yookassa-service
    env_file:
      - .env
    expose:
      - "5000"
    volumes:
      - ~/logs:/logs
    restart: always